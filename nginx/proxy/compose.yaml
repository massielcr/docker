services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
      - "2525:2525"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  ghost:
    image: ghost:latest
    container_name: ghost_blog
    restart: always
    # ports:
    #   # Map host port 80 to container port 2368
    #   - "80:2368"
    environment:
      # THE FIX: Strip out the :2368 port. Use a clean HTTP localhost.
      NODE_ENV: development
      url: http://localhost:8080      
      
      # Essential flags to override the production-only webhook requirements
      social_web_enabled: "true"
      enableDeveloperExperiments: "true"

  email:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    # ports:
    #   - "8025:8025"
    #   - "1025:1025"
      
  hello:    
    image: hashicorp/http-echo:latest 
    container_name: hello_world   
    command: ["-text", "Hello!"]
    # ports:
    #   - "5678:5678"    
    restart: always
