services:
  nginx:
    image: nginx:latest
    container_name: nginx_load
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    hostname: nginx

  echo1:
    image: weshigbee/nginx-echo:latest
    container_name: echo1
    hostname: echo1
    ports:
      - "5000:8080"
  echo2:
    image: weshigbee/nginx-echo:latest
    container_name: echo2
    hostname: echo2
  echo3:
    image: weshigbee/nginx-echo:latest
    container_name: echo3
    hostname: echo3