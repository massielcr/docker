services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"      
      - "8080:8080"  
      - "8081:8081"  
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../static/nginx_org/out:/out
    command: ["nginx-debug", "-g", "daemon off;"]
    restart: always

  echo:
    image: weshigbee/nginx-echo:latest
    container_name: echo
    ports:
      - "5000:80"    
    restart: always