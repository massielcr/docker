services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "2525:2525"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/certs
    hostname: nginx

  echo:
    image: weshigbee/nginx-echo:latest
    container_name: echo
    hostname: echo
    #ports:
    #  - "5000:8080"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: email
