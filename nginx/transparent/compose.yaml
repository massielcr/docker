services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "8081:8081"
      - "2525:2525"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    hostname: nginx

  echo:
    image: weshigbee/nginx-echo:latest
    container_name: transparent-echo
    hostname: echo
    ports:
      - "5000:8080"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: email
    # ports:
    #   - "8025:8025"
    #   - "1025:1025"
    restart: always